<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ '/' | relative_url }}">
      <svg class="logo-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="7" fill="#17263C"/>
        <path d="M7 23V11h6v5h6v-5h6v12" fill="none" stroke="#39A982" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="16" cy="20.5" r="1.4" fill="#F7F9FB"/>
      </svg>
      <span class="logo-text">Urban GIS Lab</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">Menu</span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
      <details class="nav-details">
        <summary>Tutorials</summary>
        <div class="nav-sub">
          <a href="{% link _posts/2026-11-07-population-density-analysis-arcgis-pro.md %}"{% if page.url contains "population-density-analysis-arcgis-pro" %} aria-current="page"{% endif %}>Population Density Analysis</a>
          <a href="{% link _posts/2026-11-07-urban-accessibility-analysis-arcgis-pro.md %}"{% if page.url contains "urban-accessibility-analysis-arcgis-pro" %} aria-current="page"{% endif %}>Urban Accessibility Analysis</a>
        </div>
      </details>
      <a href="{{ '/' | relative_url }}#about">About</a>
      {% include course-cta.html label="Explore the Course" modifier="btn-nav" %}
    </nav>
  </div>
</header>
<noscript>
  <style>
    @media (max-width: 860px) {
      .site-nav { display: flex !important; position: static; }
    }
  </style>
</noscript>
