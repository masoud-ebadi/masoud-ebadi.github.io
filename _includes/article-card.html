<article class="article-card">
  <a class="article-card-media" href="{{ include.post.url | relative_url }}">
    <img
      src="{{ include.post.card_image | relative_url }}"
      alt="{{ include.post.card_alt }}"
      width="800"
      height="450"
      loading="lazy"
      decoding="async">
  </a>
  <div class="article-card-body">
    <p class="eyebrow">Tutorial</p>
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    <p>{{ include.post.card_text }}</p>
    <a class="text-link" href="{{ include.post.url | relative_url }}">Read Article</a>
  </div>
</article>
