{% assign ga = site.google_analytics %}
{% if ga and ga != "" and ga != "GOOGLE_ANALYTICS_ID" %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga | uri_escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", {{ ga | jsonify }}, { "anonymize_ip": true });
</script>
{% endif %}
