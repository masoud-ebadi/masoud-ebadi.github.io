<svg class="icon" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
  {% case include.name %}
  {% when "form" %}
  <rect x="4" y="4" width="10" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <rect x="18" y="4" width="10" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <rect x="18" y="14" width="10" height="14" rx="1.5" fill="#39A982" fill-opacity="0.85" stroke="#17263C" stroke-width="1.6"/>
  <rect x="4" y="18" width="10" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  {% when "ratio" %}
  <path d="M8 26V12h8v14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M16 26V6h8v20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M8 16h8M8 20h8M16 10h8M16 14h8M16 18h8" stroke="#39A982" stroke-width="1.4"/>
  {% when "population" %}
  <circle cx="10" cy="12" r="2.2" fill="currentColor"/>
  <circle cx="17" cy="9" r="2.2" fill="currentColor"/>
  <circle cx="22" cy="14" r="2.2" fill="#39A982"/>
  <path d="M6 25c.6-3 2.6-4.5 4.8-4.5S15 22 15.6 25M13 25c.6-3.2 2.8-5 5.2-5s4.6 1.8 5.2 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  {% when "site" %}
  <rect x="4" y="6" width="24" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M4 12h24M10 6v20M18 6v20" stroke="currentColor" stroke-width="1.2" opacity="0.45"/>
  <path d="M16 11.5c2.2 0 3.6 1.6 3.6 3.4 0 2.6-3.6 6.1-3.6 6.1s-3.6-3.5-3.6-6.1c0-1.8 1.4-3.4 3.6-3.4z" fill="#39A982"/>
  <circle cx="16" cy="14.8" r="1.1" fill="#17263C"/>
  {% when "route" %}
  <circle cx="7" cy="23" r="2.2" fill="currentColor"/>
  <circle cx="25" cy="8" r="2.2" fill="#39A982"/>
  <path d="M8.5 21.5 14 16h6l5.5-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  {% when "access" %}
  <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="16" cy="16" r="5.5" fill="none" stroke="#39A982" stroke-width="1.6"/>
  <circle cx="16" cy="16" r="1.6" fill="currentColor"/>
  {% when "allocation" %}
  <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#39A982"/>
  <circle cx="6" cy="7" r="2" fill="currentColor"/>
  <circle cx="26" cy="8" r="2" fill="currentColor"/>
  <circle cx="24" cy="25" r="2" fill="currentColor"/>
  <path d="M8 8.2 12.5 13.5M24.2 9.4 19.2 13.2M22.6 23.4 18.6 19" stroke="currentColor" stroke-width="1.4"/>
  {% when "hotspot" %}
  <circle cx="16" cy="16" r="4" fill="#39A982"/>
  <circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
  {% when "growth" %}
  <path d="M5 26h22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M8 26V18M14 26V13M20 26V8" stroke="#39A982" stroke-width="3" stroke-linecap="round"/>
  {% when "shadow" %}
  <path d="M8 22 14 10l6 12H8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M15 22h10l-4 6H11l4-6z" fill="#39A982" fill-opacity="0.9"/>
  <circle cx="24" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5"/>
  {% endcase %}
</svg>
