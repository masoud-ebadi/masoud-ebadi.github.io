# Urban GIS Lab
# Replace `url` before publishing. Use your GitHub Pages origin or custom domain.
# User/organization site:  url: "https://username.github.io"   baseurl: ""
# Project site:           url: "https://username.github.io"   baseurl: "/repository-name"
# Custom domain:          url: "https://example.com"          baseurl: ""

title: Urban GIS Lab
tagline: Practical GIS for Understanding and Planning Cities.
description: >-
  Practical GIS for understanding and planning cities. Tutorials and a Udemy
  course on urban spatial analysis with ArcGIS Pro, taught by Masoud Ebadi.
url: "https://urbangispro.github.io"
baseurl: ""
lang: en
timezone: Asia/Tehran

author:
  name: Masoud Ebadi

logo: /assets/images/logo-urban-gis-lab.png

twitter:
  card: summary_large_image

# Paste a real GA4 measurement ID (G-XXXXXXXX). The placeholder is not loaded.
google_analytics: GOOGLE_ANALYTICS_ID

# Paste the token from Google Search Console. Leave blank until you have one.
google_site_verification: ""

course:
  name: "Urban Spatial Analysis & Modeling with ArcGIS Pro"
  instructor: Masoud Ebadi
  url: "https://www.udemy.com/course/urban-spatial-analysis-with-arcgis-pro/?referralCode=64855D6258A9CB243BD7"
  language: English
  sections: 9
  lectures: 56
  hours: 16
  minutes: 13

permalink: /:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: ["apos", "quot", "ltquot", "gtquot"]

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image:
        path: /assets/images/og-urban-gis-lab.png
        width: 1200
        height: 630
        alt: "Urban GIS Lab. Practical GIS for understanding and planning cities."
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Masoud Ebadi

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - node_modules
  - script

sass:
  style: compressed
